[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgtv-follow"
dynamic = ["version"]
description = "Make your Mac follow an LG webOS TV's input: connect/disconnect the display and switch audio when the TV changes input."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["lg", "webos", "tv", "macos", "betterdisplay", "hdmi"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = [
  "websockets>=15",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kingsleydon/lgtv-follow"
Issues = "https://github.com/kingsleydon/lgtv-follow/issues"

[project.scripts]
lgtv-follow = "lgtv_follow.cli:main"

[tool.hatch.version]
path = "src/lgtv_follow/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
